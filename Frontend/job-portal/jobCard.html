<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Job Card with Skills</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css"
      rel="stylesheet"
    />

    <style>
      .job-card {
        border: 1px solid #e0e0e0;
        border-radius: 10px;
        padding: 10px 16px; /* Adjusted padding to decrease height */
        margin: 8px auto; /* Centered with auto margin */
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        max-width: 800px; /* Increased width */
        height: auto; /* Ensures card height is adaptive */
        -webkit-box-shadow: 11px 11px 23px -12px rgba(0, 0, 0, 0.86);
        -moz-box-shadow: 11px 11px 23px -12px rgba(0, 0, 0, 0.86);
        box-shadow: 11px 11px 23px -12px rgba(0, 0, 0, 0.86);
        transition: all ease-in .3s;
      }

      .job-card:hover {
        transform: translateY(5px);
      }

      .badge-custom {
        background-color: #0d6efd;
        color: white;
      }

      .job-details span {
        font-weight: 600;
      }

      .skills-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .skill-badge {
        background-color: #155991;
        color: #fff;
        padding: 5px 10px;
        border-radius: 5px;
        font-size: 0.9rem;
      }

    
    </style>
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          <div class="job-card">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <h4 class="mb-0">Full Stack Developer</h4>
              <span class="badge badge-custom">Remote</span>
            </div>

            <div class="mb-2 text-muted location">
              <i class="bi bi-geo-alt"></i> San Francisco, CA
            </div>

            <div class="job-details">
              <p><span>Experience:</span> 2-4 years</p>
              <p>80,000 - 100,000/year</p>
              <p>Full-time</p>
            </div>

            <div class="mb-2">
              <h6>Skills Required:</h6>
              <div class="skills-list">
                <span class="skill-badge">HTML</span>
                <span class="skill-badge">CSS</span>
                <span class="skill-badge">JavaScript</span>
                <span class="skill-badge">React</span>
                <span class="skill-badge">Node.js</span>
                <span class="skill-badge">MongoDB</span>
                <span class="skill-badge">Git</span>
              </div>
            </div>

            <div class="d-grid gap-2">
              <button class="btn btn-primary">See Details</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
